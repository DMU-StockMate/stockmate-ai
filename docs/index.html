<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockMate AI — API 문서</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }           /* Swagger 기본 상단바(URL 입력창) 숨김 */
    .sm-header {
      background: #1b1f23; color: #fff;
      padding: 20px 24px; font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .sm-header h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
    .sm-header p  { margin: 0; font-size: 13px; color: #b8c0c8; line-height: 1.6; }
    .sm-header code {
      background: #2d333b; padding: 2px 6px; border-radius: 4px; font-size: 12px;
    }
    .sm-header a { color: #79b8ff; }
  </style>
</head>
<body>
  <div class="sm-header">
    <h1>StockMate AI — API 문서</h1>
    <p>
      FastAPI AI 마이크로서비스의 OpenAPI 명세입니다. 백엔드(NestJS) 연동 계약 확인용입니다.<br />
      이 페이지는 정적 문서라 <b>Try it out은 동작하지 않습니다.</b>
      실제 호출은 AI 서버를 띄운 뒤 <code>http://localhost:8000/docs</code>에서 하세요.<br />
      명세 갱신: <code>uv run python scripts/export_openapi.py</code> 실행 후 커밋
    </p>
  </div>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: "StandaloneLayout",
        docExpansion: "list",     // 엔드포인트 목록은 펼치고 상세는 접어둔다
        defaultModelsExpandDepth: 0,
        tryItOutEnabled: false,   // 정적 페이지라 실제 호출 불가
        supportedSubmitMethods: [],
      });
    };
  </script>
</body>
</html>
